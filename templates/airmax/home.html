{% extends "base.html" %}

{% block title %}Air quality — AirMax{% endblock %}

{% block content %}
    <div class="card bg-base-100 shadow-md max-w-2xl">
        <div class="card-body">
            <h1 class="card-title">Belgian air quality</h1>
            <p>
                Signed in as <span class="font-semibold">{{ user.get_username }}</span>.
                The map lands here.
            </p>
            <div class="flex flex-wrap gap-2 pt-2">
                <span class="badge badge-success">Good</span>
                <span class="badge badge-warning">Moderate</span>
                <span class="badge badge-error">Poor</span>
            </div>
        </div>
    </div>
{% endblock %}
