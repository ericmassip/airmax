[project]
name = "airmax"
version = "0.1.0"
description = "Real-time Belgian air quality from the OpenAQ SQS stream."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.83",
    "django>=6.1,<7.0",
    "django-vite>=3.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    # Only so boto3 can read the local `aws login` session; a deployed container uses an
    # instance role and needs plain boto3.
    "botocore[crt]>=1.43.83",
    "pre-commit>=4.6.2",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.16.5",
]

[tool.ruff]
# The hand-written code sits comfortably in the 90s; 88 would rewrap it for nothing.
line-length = 100
# Migrations are generated — reformatting them only makes the next `makemigrations`
# diff noisier.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Django's Meta.indexes / Meta.constraints are mutable class attributes by design, and
# it won't accept the ClassVar annotation RUF012 asks for.
extend-ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "webappconf.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT is missing until `collectstatic` has run. Tests
    # never serve static files and a fresh checkout has no build output, so it is noise
    # here only — left un-suppressed everywhere else, where it means something.
    "ignore:No directory at:UserWarning",
]
